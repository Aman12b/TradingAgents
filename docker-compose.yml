services:
  tradingagents:
    build: .
    env_file:
      - .env
    environment:
      # API keys saved from the web UI, kept in the data volume.
      - TRADINGAGENTS_ENV_FILE=/home/appuser/.tradingagents/keys.env
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  # The web UI on http://127.0.0.1:8765, reachable from this machine only.
  tradingagents-ui:
    build: .
    command: ["ui", "--host", "0.0.0.0", "--no-browser"]
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_ENV_FILE=/home/appuser/.tradingagents/keys.env
    ports:
      - "127.0.0.1:${TRADINGAGENTS_UI_PORT:-8765}:8765"
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - TRADINGAGENTS_ENV_FILE=/home/appuser/.tradingagents/keys.env
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
